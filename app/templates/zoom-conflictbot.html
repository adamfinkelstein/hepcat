<html>
<head>
    <title>Zoom Conflictbot</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/2.12.2/css/bootstrap.css" />
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/2.12.2/css/react-select.css" />

    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="origin-trial" content="">

    <style>
    /* Note: Zoom code includes Bootstrap v3.1.1 */
    #nav-tool1 {
        margin-bottom: 0px;
        background-color: #174460;
    }
    #main-background {
        background-color: #b0b0e2;
        height: 1600px;
    }
    #main-background.started {
        background-color: #e8c2bc;
    }
    h2 {
        padding-top: 60px;
        padding-left: 20px;
    }
    #debugging-output {
        padding: 25px;
        margin-top: 20px;
        margin-left: 40px;
        width: 600px;
        height: 400px;
        overflow-x: scroll;
        overflow-y: scroll;
        background-color: #eee;
    }
    </style>
</head>
<body>
    <div id="main-background">
    <nav id="nav-tool1" class="navbar navbar-inverse navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" href="#">Zoom Conflictbot</a>
            </div>
            <div id="navbar" class="websdktest">

                <form class="navbar-form navbar-right" id="meeting_form">
                    <div class="form-group">
                        <input type="text" name="meeting_number" id="meeting_number" value="" maxLength="200"
                            placeholder="Meeting Number" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <input type="text" name="meeting_passwd" id="meeting_passwd" value="" maxLength="32" 
                            placeholder="Meeting Password" class="form-control">
                    </div>

                    <button type="button" class="btn btn-primary" id="join_button">Join</button>

                    <div class="form-group">
                        <input type="text" name="meeting_room" id="meeting_room" value="" maxLength="10" 
                            placeholder="Meeting Room" class="form-control">
                    </div>

                    <button type="button" class="btn btn-primary" id="start_button">Start</button>
                    <button type="button" class="btn btn-primary" id="bring_button">Bring</button>
                </form>
            </div>
            <!--/.navbar-collapse -->
        </div>
    </nav>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.slim.min.js" integrity="sha512-5NqgLBAYtvRsyAzAvEBWhaW+NoB+vARl6QiA02AFMhCWvPpi7RWResDcTGYvQtzsHVCfiUhwvsijP+3ixUk1xw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js" integrity="sha512-3j3VU6WC5rPQB4Ld1jnLV7Kd5xr+cq9avvhwqzbH/taCRNURoeEpoPBK9pDyeukwSxwRPJ8fDgvYXd6SkaZ2TA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.js" crossorigin="anonymous"></script>

    <script src="https://source.zoom.us/2.12.2/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/2.12.2/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/2.12.2/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/2.12.2/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/2.12.2/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-2.12.2.min.js"></script>

    <h2>Hepcat Zoom Conflictbut Debug Info:</h2>

    <div id="debugging-output">
        
        Hepcat Users without Unique Names:
        <ul id="non-unique-user-list"></ul>

        Zoom Users with Unrecognized Names:
        <ul id="unrecognized-user-list"></ul>

        Current Rooms (with conflicts):
        <ul id="room-list"></ul>

        All Users (showing current rooms):
        <ul id="all-user-list"></ul>

    </div>
    </div>

    <script>

    // globals associated with hepcat
    let globUniqueNames = null;
    const globHepcatSocket = io("/" + "{{ conflictbot_socket }}");
    const globConflictsByRoom = {};
    console.log('opened socket to hepcat');

    // globals passed from web server
    const globURL = "{{ url }}";
    const globZoomClientID = "{{ client_id }}";
    const globZoomClientSecret = "{{ client_secret }}";

    // globals set by GUI operations
    const globUserWarningsShown = [];
    let globJoinedMeeting = false;
    let globStartedQueue = false;
    let globMeetingNumber = ''; // stored as string
    let globMeetingPasswd = '';
    let globMeetingRoom = '';
    let globSignature = null;
    let globMyZoomUser = null;

    function addLItoUL(ul, html) {
        const li = document.createElement('li');
        li.innerHTML = html;
        ul.appendChild(li);
    }

    function userToNameEmail(user) {
        // note if we use angle brackets "<>" 
        // ...we would need to be careful setting HTML
        return user.full_name + " (" + user.email + ")";
    }

    function userArrToNameEmail(arr) {
        return arr.map( user => userToNameEmail(user) );
    }

    function receiveHepcatUsers(users) {
        const ul = document.getElementById('all-user-list');
        ul.innerHTML = ''; // clear old list
        for (let i = 0; i < users.length; i++) {
            const user = users[i];
            // console.log(user);
            let html = ' [' + user.room_name + '] ' + userToNameEmail(user);
            addLItoUL(ul, html);
        }
    }

    function addNamesToNonUniqueUserList(names) {
        const ul = document.getElementById('non-unique-user-list');
        for (let i = 0; i < names.length; i++) {
            const name = names[i];
            addLItoUL(ul, name);
            // console.log(name);
        }
    }

    function replaceUnrecognizedUserList(names) {
        const ul = document.getElementById('unrecognized-user-list');
        ul.innerHTML = ''; // clear old list
        for (let i = 0; i < names.length; i++) {
            const name = names[i];
            addLItoUL(ul, name);
            console.log(name);
        }
    }

    function getRoomItem(room) {
        let roomLI = document.getElementById(room);
        if (!roomLI) {
            const parent = document.getElementById('room-list');
            roomLI = document.createElement('li');
            roomLI.setAttribute('id', room);
            parent.appendChild(roomLI);
        }
        return roomLI;
    }

    function updateRoomInfo(data) {
        const item = getRoomItem(data.room);
        item.innerHTML = data.room + ': Paper ' + data.paper + ' (show ' + data.show + ')';
        const conflicts = data.emails;
        if (!conflicts || !conflicts.length) return;
        const ul = document.createElement('ul');
        item.appendChild(ul);
        for (let i = 0; i < conflicts.length; i++) {
            const email = conflicts[i];
            const li = document.createElement('li');
            li.innerHTML = email;
            ul.appendChild(li);
        }
    }
    
    // Receive list of users
    globHepcatSocket.on('user-list', function(users) {
        console.log('Got users:');
        console.log(users);
        receiveHepcatUsers(users);
        recordUniqueUserNames(users);
    });

    // Receive list of conflicts and paper metadata
    globHepcatSocket.on('conflicts', function(data) {
        console.log('Got conflicts:');
        console.log(data);
        updateRoomInfo(data);
        const room = data.room;
        globConflictsByRoom[room] = data;
        // only when advancing to paper (not when showing it), and only for this room:
        if (!data.show && data.room === globMeetingRoom) {
            checkZoomConflictsIfStarted();
        }
    });

    function uniqueInArr(arr) {
        const lower = arr.map(str => str.toLowerCase());
        const uniq = lower.filter(value => lower.indexOf(value) === lower.lastIndexOf(value));
        return uniq;
    }

    function recordUniqueUserNames(hepcatUsers) {
        let allNames = [];
        // fill globUniqueNames
        hepcatUsers.forEach( user => {
            parts = user.full_name.split(' ');
            allNames = allNames.concat(parts);
        });
        globUniqueNames = {};
        const uniqNames = uniqueInArr(allNames);
        const issueNameWarnings = []
        hepcatUsers.forEach( user => {
            email = user.email.toLowerCase();
            globUniqueNames[email] = user;
            parts = user.full_name.split(' ');
            let userHasUniqName = false;
            parts.forEach( name => {
                lower = name.toLowerCase();
                if (uniqNames.includes(lower)) {
                    globUniqueNames[lower] = user;
                    userHasUniqName = true;
                }
            });
            const warnedAlready = globUserWarningsShown.includes(email);
            if (!userHasUniqName && !warnedAlready) {
                issueNameWarnings.push(user);
                globUserWarningsShown.push(email);
            }
        });
        if (issueNameWarnings.length) {
            // One alert box listing all users
            const nameList = userArrToNameEmail(issueNameWarnings);
            const nameString = nameList.join(', \n');
            const msg = 'Warning! Some Hepcat users have no unique parts in their names, so include emails in their zoom names: \n' + nameString;
            console.log(msg);
            addNamesToNonUniqueUserList(nameList);
            alert(msg);
        }
        // console.log('unique names and dict', uniqNames, globUniqueNames);
    }

    // Run when page is first loaded
    $(document).ready(function() {
        console.log('document ready');
        copyMeetingInfoFromCookiesToGlobs();
        copyMeetingInfoFromGlobsToGUI();

        ZoomMtg.preLoadWasm(); // AF thinks maybe not needed based on SMR
        ZoomMtg.prepareWebSDK();

        registerHandlers();
        console.log('completed doc ready');
    });

    function copyMeetingInfoFromGlobsToGUI() {
        $('#meeting_number').val(globMeetingNumber);
        $('#meeting_passwd').val(globMeetingPasswd);
        $('#meeting_room').val(globMeetingRoom);
    }
    
    function copyMeetingInfoFromGUItoGlobs() {
        globMeetingNumber = $('#meeting_number').val();
        globMeetingPasswd = $('#meeting_passwd').val();
        globMeetingRoom = $('#meeting_room').val();
    }

    function copyMeetingInfoFromGlobsToCookies() {
        const expires_in_days = 7;
        $.cookie("meeting_number", globMeetingNumber, { expires: expires_in_days } );
        $.cookie("meeting_passwd", globMeetingPasswd, { expires: expires_in_days } );
        $.cookie("meeting_room", globMeetingRoom, { expires: expires_in_days } );
        console.log('set cookies: ', globMeetingNumber, globMeetingPasswd, globMeetingRoom);
    }

    function copyMeetingInfoFromCookiesToGlobs() {
        globMeetingNumber = $.cookie("meeting_number");
        globMeetingPasswd = $.cookie("meeting_passwd");
        if (!!globMeetingNumber) {
            globMeetingNumber = '';
        }
        if (!!globMeetingPasswd) {
            globMeetingPasswd = '';
        }
        console.log('got cookies: ', globMeetingNumber, globMeetingPasswd);
    }

    function generateZoomSignatureAndJoin() {
        ZoomMtg.generateSDKSignature({
            meetingNumber: globMeetingNumber,
            sdkKey: globZoomClientID,
            sdkSecret: globZoomClientSecret,
            role: 0,
            success: function (res) {
                globSignature = res.result;
                console.log('got signature: ' + globSignature);
                zoomInitEtc();
            },
            error: function (res) {
                console.log('generateSDKSignature error:');
                console.log(res);
            },
        });
    }

    function setButtonStates() {
        if (globJoinedMeeting) {
            $("#join_button").html('Leave');
            $("#start_button").removeClass('disabled');
            $("#bring_button").removeClass('disabled');
        }
        else {
            $("#join_button").html('Join');
            $("#start_button").addClass('disabled');
            $("#bring_button").addClass('disabled');
        }
    }

    function registerHandlers() {
        $('#meeting_room').on('change', handleMeetingRoomChange );
        $("#join_button").click( handleJoinButton );
        $("#start_button").click( handleStartButton );
        $("#bring_button").click( handleBringButton );
        setButtonStates();
    }

    const roomMap = {
        'p' : 'Plenary',
        'a' : 'Room_A',
        'b' : 'Room_B',
        'x' : 'Room_X',
        'y' : 'Room_Y',
        'plenary' : 'Plenary',
        'room_a' : 'Room_A',
        'room_b' : 'Room_B',
        'room_x' : 'Room_X',
        'room_y' : 'Room_Y'
    };

    function checkZoomConflictsIfStarted() {
        // see if we need to change zoom situation
        if (globJoinedMeeting && globStartedQueue && globMeetingRoom in globConflictsByRoom) {
            const data = globConflictsByRoom[globMeetingRoom];
            putConflictsOnHoldInZoom(data.emails);
        }
    }

    function handleMeetingRoomChange() {
        const room = $('#meeting_room').val();
        const lower = room.toLowerCase();
        const update = (lower in roomMap) ? roomMap[lower] : 'Plenary';
        $('#meeting_room').val(update);
        globMeetingRoom = update;
        console.log('update room as: ', room, update);
        checkZoomConflictsIfStarted();
    }

    function handleJoinButton() {
        if (globJoinedMeeting) { // already joined, so leave
            leaveZoomMeeting();
        }
        else { // join now
            handleMeetingRoomChange(); // meeting room will default to Plenary if not set already
            copyMeetingInfoFromGUItoGlobs();
            copyMeetingInfoFromGlobsToCookies();
            generateZoomSignatureAndJoin();
        }
    }

    function handleStartButton() {
        if (globStartedQueue) { // was already started
            globStartedQueue = false;
            $("#start_button").html('Start');
            $("#main-background").removeClass('started');
            // bring everyone from waiting room when we stop running
            bringZoomUsersFromHold();
        }
        else {
            console.log('about to verify host and if so start queue...');
            verifyHostThenRunFunction(()=>{
                globStartedQueue = true;
                $("#main-background").addClass('started');
                $("#start_button").html('Stop');
                console.log('start queue. check for conflicts...');
                checkZoomConflictsIfStarted();
            });
        }
    }

    function handleBringButton() {
        verifyHostThenRunFunction(()=>{
            bringZoomUsersFromHold();
        });
    }

    function zoomInitEtc() {
        ZoomMtg.init({
            leaveUrl: globURL, 
            isSupportAV: false,
            disableCallOut: true,
            disableInvite: true,
            disableJoinAudio: true,
            audioPanelAlwaysOpen: false,
            disablePreview: true,
            disableVoIP: true,
            success: function (res) {
                console.log("ZoomMtg initialized. Now can join...");
                joinZoomAfterInit();
            },
            error: function (res) {
                console.log('zoom init error: ', res);
            }
        });
    }

    function resetTabTitle() {
        // because zoom changed title, change it back...
        document.title = "Zoom Conflictbot";
    }

    function callResetTitleInASec() {
        setTimeout(() => {
            resetTabTitle();
        }, "1000");
    }

    function joinZoomAfterInit() {
        console.log('joinZoomAfterInit');
        ZoomMtg.join({
            meetingNumber: globMeetingNumber,
            passWord: globMeetingPasswd,
            userName: "=== Hepcat Zoom Conflictbot ===",
            userEmail: "conflictbot@example.com",
            // either apiKey or sdkKey is required:
            sdkKey: globZoomClientID,
            signature: globSignature, // set in function above
            success: function (res) {
                console.log("join meeting success. hide zmmtg-root");
                $("#zmmtg-root").hide(); // hide zoom display etc
                globJoinedMeeting = true;
                setButtonStates();
                getMyZoomID();
            },
            error: function (res) {
                console.log('meeting join error:');
                console.log(res);
            },
        });
    }

    function getMyZoomID() {
        console.log("getMyZoomID");
        ZoomMtg.getCurrentUser({
            success: function (res) {
                globMyZoomUser = res.result.currentUser;
                console.log("success getCurrentUser", globMyZoomUser);
                callResetTitleInASec();
            },
            error: function (res) {
                console.log('getMyZoomID error:');
                console.log(res);
            },
        });
    }

    function zoomUserIsHost(zoomUser) {
        return (zoomUser.isHost || zoomUser.isCoHost);
    }

    function myZoomUserIsHost() {
        if (!globMyZoomUser) return False;
        return zoomUserIsHost(globMyZoomUser);
    }

    function myZoomUserIsThisUser(user) {
        if (!globMyZoomUser || !user) return False;
        return (globMyZoomUser.userId === user.userId);
    }

    function checkIfZoomHostThenRunFunction(fnIfIsHost, fnIfNotHost) {
        console.log("checkIfZoomHostThenRunFunction");
        resetTabTitle(); // (any time user clicks something)
        ZoomMtg.getCurrentUser({
            success: function (res) {
                globMyZoomUser = res.result.currentUser;
                console.log("success getCurrentUser", globMyZoomUser);
                if (myZoomUserIsHost()) {
                    fnIfIsHost();
                }
                else {
                    fnIfNotHost();
                }
            },
            error: function (res) {
                console.log('getMyZoomID error:');
                console.log(res);
            },
        });
    }

    function verifyHostThenRunFunction(fnIfIsHost) {
        checkIfZoomHostThenRunFunction(fnIfIsHost, alertNotHost);
    }

    function alertNotHost() {
        alert('Sorry you need to promote conflictbot to meeting (co-)host before this operation can be performed!');
    }

    function processAllZoomAttendees(processZoomUser) {
        ZoomMtg.getAttendeeslist({
            success: function (res) {
                const attendees = res.result.attendeesList;
                console.log("loop over attendees:", attendees);
                attendees.map( zoomUser => processZoomUser(zoomUser) );
            },
            error: function (res) {
                console.log('getAttendeeslist error: ', res);
            },
        });
    }

    function setZoomUserOnOrOffHold(zoomUser, holdOnOff) {
        const name = zoomUser.userName;
        const id = zoomUser.userId;
        if (zoomUser.isHold === holdOnOff) return; // ignore if already correct setting
        if (myZoomUserIsThisUser(zoomUser)) return; // ignore for this user
        console.log('putOnHold user: ', name, holdOnOff);
        ZoomMtg.putOnHold({
            userId: id,
            hold: holdOnOff,
            success: function (res) {
                console.log('putOnHold success for user: ', name);
            },
            error: function (res) {
                console.log('putOnHold name, error: ', name, res);
            },
        });
    }

    function setZoomUserMuteOrUnmute(zoomUser, muteOnOff) {
        const name = zoomUser.userName;
        const id = zoomUser.userId;
        if (zoomUser.muted === muteOnOff) return; // ignore if already correct setting
        console.log('setZoomUserMuteOrUnmute user: ', name, muteOnOff);
        ZoomMtg.mute({
            userId: id,
            mute: muteOnOff,
            success: function (res) {
                console.log('setZoomUserMuteOrUnmute success for user: ', name);
            },
            error: function (res) {
                console.log('setZoomUserMuteOrUnmute name, error: ', name, res);
            },
        });
    }

    function bringZoomUsersFromHold() {
        console.log("bringZoomUsersFromHold");
        processAllZoomAttendees( zoomUser => {
            if (zoomUser.isHold) {
                setZoomUserOnOrOffHold(zoomUser, false);
            }
        });
    }

    function leaveZoomMeeting() {
        ZoomMtg.leaveMeeting({});
        globJoinedMeeting = false;
        setButtonStates();
    }

    function matchZoomUserToHepcat(zoomUser) {
        name = zoomUser.userName.toLowerCase();
        parts = name.split(' ');
        found = null;
        while (!found && parts.length) {
            first = parts.shift();
            if (first in globUniqueNames) {
                found = globUniqueNames[first];
                console.log('Matched name, for zoom, hepcat users',first,zoomUser,found);
            }
        }
        return found;
    }

    function putConflictsOnHoldInZoom(confEmails) {
        console.log('putConflictsOnHoldInZoom ',confEmails);
        const unrecognizedZoomUsers = [];
        processAllZoomAttendees( zoomUser => {
            if (myZoomUserIsThisUser(zoomUser)) return;
            let zoomHost = zoomUserIsHost(zoomUser);
            let hepcatUser = matchZoomUserToHepcat(zoomUser);
            let hepcatAdmin = false;
            if (hepcatUser) {
                hepcatAdmin = hepcatUser.role_is_admin;
                holdOnOff = confEmails.includes(hepcatUser.email);
                console.log('Checking for bool, hepcat email in list: ', holdOnOff, hepcatUser.email, confEmails);
                setZoomUserOnOrOffHold(zoomUser, holdOnOff)
            }
            else if (!zoomHost) {
                unrecognizedZoomUsers.push(zoomUser.userName);
                console.log('Zoom user (not host) unknown to Hepcat: ', zoomUser.userName);
            }
            // mute all zoom users who are neither zoom host nor hepcat admin
            if (!hepcatAdmin && !zoomHost) {
                setZoomUserMuteOrUnmute(zoomUser, true);
            }
        });
        replaceUnrecognizedUserList(unrecognizedZoomUsers);
    }

</script>

</body>
</html>
