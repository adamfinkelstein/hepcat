<html>
    <head>
        <title>Hepcat Conflictbut Debugger</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta content="utf-8" http-equiv="encoding">
    </head>
    <body>
    
    <h1>Hepcat Conflictbut Debugger</h1>
    
    Current Paper Info:
    <ul>
        <li>Paper: <span id="paper-elem"></span></li>
        <li>Show: <span id="show-elem"></span></li>
    </ul>

    Current Conflicts:
    <ul id="conflict-list-elem">
    </ul>
    
    All Users:
    <ul id="user-list-elem">
    </ul>
        
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.js" crossorigin="anonymous"></script>

    <script>
        
    function setUsers(users) {
        const ul = document.getElementById('user-list-elem');
        ul.innerHTML = ''; // clear old list
        for (let i = 0; i < users.length; i++) {
            const user = users[i];
            console.log(user);
            const li = document.createElement('li');
            li.innerHTML = user.full_name + " (" + user.email + ")";
            ul.appendChild(li);
        }
    }

    function setConflicts(conflicts) {
        const ul = document.getElementById('conflict-list-elem');
        ul.innerHTML = ''; // clear old list
        for (let i = 0; i < conflicts.length; i++) {
            const email = conflicts[i];
            const li = document.createElement('li');
            li.innerHTML = email;
            ul.appendChild(li);
        }
    }

    function setPaper(paper, show) {
        console.log('Show paper: ' + paper + " = " + show);
        const liPaper = document.getElementById('paper-elem');
        const liShow = document.getElementById('show-elem');
        liPaper.innerHTML = paper;
        liShow.innerHTML = show;
    }

    const socket = io("/lurk_NxtCmHS8aDj6");
    console.log('opened LURKER socket namespace in this socket:');
    console.log(socket);
    
    // This is not necessary - just here to check for connection
    socket.on('connect', function() {
        console.log('Socket connected on id: ' + socket.id);
    });
    
    // Receive list of users
    socket.on('user-list', function(users) {
        console.log('Got users:');
        console.log(users);
        setUsers(users);
    });

    // Receive list of conflicts and paper metadata
    socket.on('conflicts', function(data) {
        console.log('Got conflicts:');
        console.log(data);
        setConflicts(data.emails);
        setPaper(data.paper, data.show);
    });
    
    </script>
    
    </body>
    </html>
