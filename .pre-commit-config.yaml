# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # generic code formatting checkers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=4000']

  # python linter
  - repo: https://github.com/pycqa/flake8
    rev: '7.1.1'
    hooks:
      - id: flake8
        args:
          - --max-line-length=88
          - --extend-ignore=E203,E402

  # python code formatter
  - repo: https://github.com/psf/black
    rev: '25.1.0'
    hooks:
      - id: black
        # args:
        #   - --skip-string-normalization

  # jinja code formatter
  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: 'v1.36.4'
    hooks:
      - id: djlint-reformat
        args:
          - --profile=jinja

  # javascript linter
  # Note tried to update to 9.19.0 2025-10-06 but it gave errors
  # on missing config file that I don't know how to set up.
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 'v8.47.0'
    hooks:
      - id: eslint

  # css linter
  # (issues need to be addressed before enabling this hook)
  # - repo: https://github.com/pre-commit/mirrors-csslint
  #   rev: 'v1.0.5'
  #   hooks:
  #     - id: csslint

  # css linter (better?)
  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: 'v16.14.1'
    hooks:
      - id: stylelint
        args: [--fix]

  # javascript/css/markdown code formatter
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: 'v4.0.0-alpha.8'
    hooks:
      - id: prettier
        args:
          - --single-quote
        types_or:
          - javascript
          - css
          - markdown
